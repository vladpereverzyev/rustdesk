# Tells when an action of the workflows has a new version, with a pull request to review.
# Once a month, so it stays quiet. The workflows that come from RustDesk are updated by the
# merges from master, so only the VirtualPort ones matter here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: virtualport
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
