name: Bug report
description: Something in the name, icons, theme, updates or build of this app does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For a security problem do not open an issue: follow the
        [security policy](https://github.com/vladpereverzyev/rustdesk/security/policy).
        A problem that the original RustDesk has too belongs to
        [RustDesk](https://github.com/rustdesk/rustdesk/issues).
  - type: input
    id: version
    attributes:
      label: Version
      description: The version of the release you downloaded, for example v1.0.0.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Windows version
      description: For example Windows 11 24H2 or Windows 10 22H2.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Screenshots or logs
      description: A screenshot that shows the problem. Do not attach patient data, IDs or passwords.
